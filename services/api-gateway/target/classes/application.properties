server.port=8080
spring.application.name=api-gateway
spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:9001}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[1].id=doctors
spring.cloud.gateway.routes[1].uri=${DOCTOR_SERVICE_URL:http://localhost:9002}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/doctors/**
spring.cloud.gateway.routes[2].id=patients
spring.cloud.gateway.routes[2].uri=${PATIENT_SERVICE_URL:http://localhost:9003}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.routes[3].id=appointments
spring.cloud.gateway.routes[3].uri=${APPOINTMENT_SERVICE_URL:http://localhost:9004}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/appointments/**
