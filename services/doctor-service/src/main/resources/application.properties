server.port=9002
spring.application.name=doctor-service
spring.datasource.url=${DOCTOR_DB_URL:jdbc:mysql://localhost:3306/hospital_doctors}
spring.datasource.username=${MYSQL_USER:hospital}
spring.datasource.password=${MYSQL_PASSWORD:hospital}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
